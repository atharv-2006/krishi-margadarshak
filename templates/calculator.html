{% extends 'base.html' %}
{% block content %}

<div class="container mt-4">

<h2 class="text-success mb-4">📊 Farmer Profit Calculator</h2>

<div class="card shadow p-4">

<form method="POST">

<div class="row">

<div class="col-md-6 mb-3">
<label>Seeds Cost (₹)</label>
<input type="number" step="0.01" name="seeds" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Fertilizer Cost (₹)</label>
<input type="number" step="0.01" name="fertilizer" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Labour Cost (₹)</label>
<input type="number" step="0.01" name="labour" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Water Cost (₹)</label>
<input type="number" step="0.01" name="water" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Other Expenses (₹)</label>
<input type="number" step="0.01" name="other" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Selling Price per Unit (₹)</label>
<input type="number" step="0.01" name="selling_price" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Total Quantity Produced</label>
<input type="number" step="0.01" name="quantity" class="form-control" required>
</div>

</div>

<button class="btn btn-success w-100">Calculate Profit</button>

</form>

</div>

{% if result %}

<div class="card shadow p-4 mt-4">

<h4>Total Cost: ₹{{ result.total_cost }}</h4>
<h4>Revenue: ₹{{ result.revenue }}</h4>

{% if result.profit >= 0 %}
<h3 class="text-success">Profit: ₹{{ result.profit }}</h3>
{% else %}
<h3 class="text-danger">Loss: ₹{{ result.profit }}</h3>
{% endif %}

</div>

{% endif %}

</div>

{% endblock %}
